spring.application.name=perfumes
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/perfumesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000

spring.mail.host=${EM_HOST:smtp.gmail.com}
spring.mail.port=${EM_PORT:587}
spring.mail.username=${EM_DIR:dev@perfumes.com}
spring.mail.password=${EM_PASS:devpassword}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.use_prepare_sql=false

app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}
jwt.refresh.expiration=86400000

spring.web.resources.static-locations=classpath:/static/,classpath:/public/,file:./uploads/
spring.mvc.static-path-pattern=/**

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

file.upload-dir=uploads
server.url=http://localhost:8080
cors.allowed-origins=http://localhost:8100,http://localhost:4200,http://localhost:3000,http://localhost:5173

stripe.secret.key=sk_test_123
app.frontend.url=http://localhost:4200
